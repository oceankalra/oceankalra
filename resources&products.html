<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Store | Ocean Kalra</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --text: #0f172a;
    --accent: #3b82f6;
    --border-gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --border-silver: linear-gradient(135deg, #71717a, #e4e4e7, #a1a1aa, #f4f4f5, #71717a);
    --shadow: 0 10px 30px rgba(0,0,0,0.05);
  }


  body.dark {
    --bg: #020617;
    --card: #0f172a;
    --text: #f8fafc;
    --accent: #60a5fa;
    --shadow: 0 10px 40px rgba(0,0,0,0.6);
  }


  body {
    margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: all 0.5s ease; -webkit-user-select: none; user-select: none;
  }


  input { user-select: text; outline: none; }


  /* --- UI NAVIGATION (FULLY UNLOCKED) --- */
  #homeBtn {
    position: fixed; top: 25px; left: 25px; z-index: 1000;
    background: var(--card); color: var(--text);
    border: 1px solid rgba(128,128,128,0.2); padding: 12px 20px; border-radius: 14px;
    font-weight: 600; cursor: pointer; opacity: 1; pointer-events: auto;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }
  #homeBtn:hover { border-color: var(--accent); transform: translateY(-2px); }


  #themeToggle {
    position: fixed; top: 25px; right: 25px; z-index: 1000;
    background: var(--card); color: var(--text);
    border: 1px solid rgba(128,128,128,0.2); padding: 12px 20px; border-radius: 14px;
    cursor: pointer; font-weight: 600; opacity: 1; transition: 0.3s;
    box-shadow: var(--shadow); backdrop-filter: blur(10px);
  }
  #themeToggle:hover { border-color: var(--accent); transform: translateY(-2px); }


  /* --- HEADER --- */
  header {
    padding: 180px 20px 120px; text-align: center;
    background: radial-gradient(circle at center, var(--accent) 0%, transparent 75%), var(--bg);
    color: var(--text);
  }


  /* --- MAIN CONTENT --- */
  <main>

  <!-- SECTION HEADER -->
  <div class="section-header">
    <h2>Digital Store</h2>
    <div></div>
  </div>

  <p style="opacity:0.7; margin-bottom:40px; font-size:1.1rem;">
    Explore digital tools, templates, and cognitive frameworks designed by Ocean Kalra.
  </p>

  <!-- GUMROAD STORE BUTTON -->
  <div style="margin: 40px 0; text-align:center;">
    <script src="https://gumroad.com/js/gumroad.js"></script>
    <a class="gumroad-button" 
       href="https://oceania.gumroad.com" 
       style="font-size:1.2rem; padding:18px 28px;">
      Visit My Gumroad Store
    </a>
  </div>

  <!-- ETSY STORE PLACEHOLDER (FOR LATER) -->
  <div class="section-header" style="margin-top:80px;">
    <h2>Etsy Store (Coming Soon)</h2>
    <div></div>
  </div>

  <p style="opacity:0.6;">
    Once your Etsy shop is ready, it will appear here with embedded listings.
  </p>

</main>



<footer>
  <div class="footer-title"> © 2026 Ocean Kalra | Public Speaking, Psychology & AI </div>
  <p style="opacity: 0.5; font-size: 11px;">All digital protocols serve as strategic advisory and educational frameworks.
  </p>
</footer>


<script>
  const toggle = document.getElementById("themeToggle");
  const body = document.body;


  // Initialize theme from storage
  if (localStorage.getItem('theme') === 'light') {
    body.classList.remove('dark');
    toggle.textContent = "🌙";
  } else {
    body.classList.add('dark');
    toggle.textContent = "☀️";
  }


  // Functional Toggle
  toggle.onclick = () => {
    body.classList.toggle("dark");
    const isDark = body.classList.contains("dark");
    toggle.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  };


  // IP Protection
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => { 
    if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'u', 's'].includes(e.key)) e.preventDefault(); 
  });
</script>
</body>

</html>
